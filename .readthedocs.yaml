# Read the Docs configuration for pism-emulator.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# The API pages import the package, so its dependencies are installed for real:
# CPU-only PyTorch first (the default Linux wheel pulls in CUDA), then the
# package's requirements, the docs toolchain, and the package itself.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    post_install:
      - python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision torchaudio
      - python -m pip install -r requirements.txt
      - python -m pip install --no-deps .

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false

python:
  install:
    - requirements: docs/requirements.txt

formats:
  - htmlzip
