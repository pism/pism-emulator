name: pism-emulator
channels:
  - conda-forge
dependencies:
  - python>=3.11,<3.14
  - pip
  # PyTorch with CUDA from conda-forge. The pytorch/nvidia channels are no longer
  # updated, and mixing them with conda-forge breaks the solve. Add e.g.
  # `cuda-version=12.6` to match an older driver; otherwise the newest CUDA build
  # supported by the driver is chosen.
  - pytorch-gpu
  - torchvision
  - torchaudio
  - lightning
  - torchmetrics
  - tensorboard
  # Scientific stack
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - joblib
  - tqdm
  - arviz
  # I/O and geospatial
  - xarray
  - dask
  - distributed
  - netcdf4
  - h5netcdf
  - h5py
  - zarr
  - rioxarray
  - cf-xarray
  - pint-xarray
  - earthaccess
  # Plotting
  - matplotlib
  - seaborn
  - bokeh
  - pyfiglet
  # Notebooks
  - notebook
  - ipywidgets
  # Development
  - pytest
  - pylint
  - mypy
  - pre-commit
  - identify
  - wget
# Then install the package itself without letting pip touch conda packages:
#   pip install -e . --no-deps
