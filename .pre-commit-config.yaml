exclude: "docs|node_modules|migrations|.git|.tox"
default_stages: [pre-commit]
fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: conda/meta.yaml

  # Can run individually with `pre-commit run black --all-files`
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black

  # Can run individually with `pre-commit run isort --all-files`
  - repo: https://github.com/timothycrosley/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args:
          - --profile
          - black

  # Numpydoc
  - repo: https://github.com/numpy/numpydoc
    rev: v1.9.0
    hooks:
      - id: numpydoc-validation

  # Can run individually with `pre-commit run mypy --all-files`
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.17.0
    hooks:
      - id: mypy
        args: ["--config-file", "pyproject.toml", "--ignore-missing-imports"]
        additional_dependencies: [types-toml, types-requests]


  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: pylint
        language: system
        types: [python]
        require_serial: true
        args:
          [
            "-rn", # Only display messages
            "-sn", # Don't display the score
            "--extension-pkg-whitelist=scipy",
          ]
