name: Static analysis

on: push

jobs:
  call-secrets-analysis-workflow:
    # Docs: https://github.com/ASFHyP3/actions
    uses: ASFHyP3/actions/.github/workflows/reusable-secrets-analysis.yml@v0.22.1
    permissions:
      contents: read

  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # pylint and pytest are local hooks that need the conda environment;
      # pylint runs in its own job below, pytest in test.yml.
      SKIP: pylint,pytest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - uses: pre-commit/action@v3.0.1

  pylint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags, for the setuptools_scm version

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          cache-environment: true
          init-shell: bash

      - name: run pylint
        shell: bash -el {0}
        run: |
          python -m pip install --no-deps -e .
          pylint -rn -sn --extension-pkg-whitelist=scipy pism_emulator
